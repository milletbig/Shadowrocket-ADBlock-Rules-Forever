name: Sync and Inject Custom Rules

on:
  schedule:
    # 每周一北京时间 01:00 自动执行（对应 UTC 周日 17:00）
    # GitHub Actions 的 cron 使用 UTC 时区，故写为 0 17 * * 0
    - cron: '0 17 * * 0'
  workflow_dispatch: # 允许随时在网页上手动触发

# 强制 GitHub Actions 使用 Node.js 24 运行环境，消除过时警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4
        # 默认浅克隆，速度更快

      - name: Download latest rules from Upstream
        run: |
          # 直接下载原作者 release 分支的最新的 Raw 文件覆盖本地
          wget -O sr_top500_banlist.conf https://raw.githubusercontent.com/Johnshall/Shadowrocket-ADBlock-Rules-Forever/release/sr_top500_banlist.conf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Injection Script
        env:
          PUSHDEER_KEY: ${{ secrets.PUSHDEER_KEY }}
        run: python inject_rules.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add sr_top500_banlist.conf
          
          # 检查文件是否有变动，如果有变动才执行 commit
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto sync and inject custom rules"
          
          # 推送到你当前所在的活动分支
          git push origin HEAD
