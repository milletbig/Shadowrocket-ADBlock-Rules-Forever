name: Sync and Inject Custom Rules

on:
  schedule:
    # 每周一北京时间 01:00 自动执行（对应 UTC 周日 17:00）
    # GitHub Actions 的 cron 使用 UTC 时区，故写为 0 17 * * 0
    - cron: '0 17 * * 0'
  workflow_dispatch: # 允许随时在网页上手动触发

jobs:
  update-rules:
    # 固定到 Ubuntu 24.04，避免 ubuntu-latest 迁移到 26 时的隐式变更
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v5
        # 默认浅克隆，速度更快

      - name: Download latest rules from Upstream
        run: |
          # 直接下载原作者 release 分支的最新的 Raw 文件覆盖本地
          # 记录拉取结果与耗时，供注入脚本生成结构化通知
          START_MS=$(date +%s%3N)
          if wget -q -O sr_top500_banlist.conf https://raw.githubusercontent.com/Johnshall/Shadowrocket-ADBlock-Rules-Forever/release/sr_top500_banlist.conf; then
            echo "UPSTREAM_FETCH_STATUS=success" >> "$GITHUB_ENV"
          else
            echo "UPSTREAM_FETCH_STATUS=failed" >> "$GITHUB_ENV"
            # 删除可能残留的空文件/半成品，交由脚本识别并发送失败通知
            rm -f sr_top500_banlist.conf
          fi
          END_MS=$(date +%s%3N)
          echo "UPSTREAM_FETCH_DURATION_MS=$((END_MS - START_MS))" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run Injection Script
        env:
          PUSHDEER_KEY: ${{ secrets.PUSHDEER_KEY }}
        run: python inject_rules.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add sr_top500_banlist.conf
          
          # 检查文件是否有变动，如果有变动才执行 commit
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto sync and inject custom rules"
          
          # 推送到你当前所在的活动分支
          git push origin HEAD
