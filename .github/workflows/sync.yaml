name: Sync and Inject Custom Rules

on:
  schedule:
    # 每天 UTC 时间 00:17 (北京时间早上 8:17) 自动执行
    - cron: '17 0 * * *'
  workflow_dispatch: # 允许你随时在网页上手动触发

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v3
        # 这里不再需要 fetch-depth: 0，默认浅克隆即可，速度更快

      - name: Download latest rules from Upstream
        run: |
          # 核心改动：放弃 Git merge，直接下载原作者 release 分支的最新的 Raw 文件覆盖本地
          wget -O sr_top500_banlist.conf https://raw.githubusercontent.com/Johnshall/Shadowrocket-ADBlock-Rules-Forever/release/sr_top500_banlist.conf

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Injection Script
        run: python inject_rules.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add sr_top500_banlist.conf
          
          # 检查文件是否有变动，如果有变动才执行 commit
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto sync and inject custom rules"
          
          # 推送到你当前所在的活动分支
          git push origin HEAD
